# CI: нативная проверка toolchain ВЕЛЕС.
# Python здесь нет: сборку и проверку выполняют сами разум и искра.
# Два рубежа: тест-раннер «тесты/прогон.раз» гоняет примеры и кейсы
# (компиляция разум+искра, запуск, сверка кода выхода и вывода), а фикс-поинт
# самосборки доказывает, что компилятор воспроизводит сам себя побайтно.
name: CI

on:
  push:
    branches: [main, develop, "feature/*"]
  pull_request:
    branches: [main, develop]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Бинарный ввод-вывод: cmd /c внутри pwsh — pwsh корректно передаёт
      # юникодные пути (кириллица), а cmd делает байтовое перенаправление.
      - name: Проверка сид-бинарников (MZ)
        run: |
          if (([IO.File]::ReadAllBytes("$PWD\искра.exe")[0..1] -join ',') -ne '77,90') { throw "искра.exe не PE" }
          if (([IO.File]::ReadAllBytes("$PWD\raz\разум.exe")[0..1] -join ',') -ne '77,90') { throw "разум.exe не PE" }

      - name: искра собирает привет.иск
        run: |
          cmd /c "искра.exe < examples\привет.иск > привет.exe"
          cmd /c "привет.exe"

      - name: Безопасность типов — строгий лог
        run: |
          cmd /c "raz\разум.exe < тесты\лог\если_число.раз > лог_ошибка.txt"
          if ($LASTEXITCODE -eq 0) { throw "если 5 ошибочно принято" }
          if (-not (Select-String -Path лог_ошибка.txt -Pattern "условие должно иметь тип лог" -SimpleMatch -Quiet)) { throw "нет диагностики строгого лог" }
          cmd /c "raz\разум.exe < тесты\лог\верные.раз > лог_верно.иск"
          if ($LASTEXITCODE -ne 0) { throw "корректный лог отклонён" }

      - name: Режимы безопасности — надёжно|быстро
        run: |
          cmd /c "raz\разум.exe < тесты\лог\верные.раз > режим_умолч.иск"
          if (-not (Select-String -Path режим_умолч.иск -Pattern ";режим надёжно" -SimpleMatch -Quiet)) { throw "умолчание не надёжно" }
          cmd /c "raz\разум.exe --режим быстро < тесты\лог\верные.раз > режим_быс.иск"
          if (-not (Select-String -Path режим_быс.иск -Pattern ";режим быстро" -SimpleMatch -Quiet)) { throw "нет ;режим быстро" }
          cmd /c "raz\разум.exe -O1 --режим быстро < тесты\лог\верные.раз > режим_o1.иск"
          if (-not (Select-String -Path режим_o1.иск -Pattern ";режим быстро" -SimpleMatch -Quiet)) { throw "-O1 сменил режим" }
          cmd /c "raz\разум.exe --режим криво < тесты\лог\верные.раз > режим_ош.txt"
          if ($LASTEXITCODE -eq 0) { throw "неизвестный режим принят" }
          if (-not (Select-String -Path режим_ош.txt -Pattern "неизвестный режим" -SimpleMatch -Quiet)) { throw "нет диагностики режима" }
          cmd /c "raz\разум.exe --режим быстро < тесты\лог\если_число.раз > лог_быс.txt"
          if ($LASTEXITCODE -eq 0) { throw "быстро: если 5 ошибочно принято" }

      - name: Границы массивов — надёжно ловит, быстро не генерирует
        run: |
          cmd /c "raz\разум.exe < тесты\границы\дин_чтение.раз > г_дин.иск"
          cmd /c "искра.exe < г_дин.иск > г_дин.exe"
          cmd /c "г_дин.exe"
          if ($LASTEXITCODE -ne 101) { throw "дин чтение: код $LASTEXITCODE вместо 101" }
          cmd /c "raz\разум.exe --режим быстро < тесты\границы\конст_чтение.раз > г_ош.txt"
          if ($LASTEXITCODE -eq 0) { throw "быстро: константа вне границ принята" }
          if (-not (Select-String -Path г_ош.txt -Pattern "вне границ массива" -SimpleMatch -Quiet)) { throw "нет диагностики границы" }
          cmd /c "raz\разум.exe --режим быстро < тесты\границы\дин_чтение.раз > г_быс.иск"
          if (Select-String -Path г_быс.иск -Pattern "стд_сбой_границы" -SimpleMatch -Quiet) { throw "быстро: сгенерирована проверка" }

      - name: Границы срезов — индекс 101, создание 102, быстро без проверок
        run: |
          cmd /c "raz\разум.exe < тесты\границы\ср_инд_дин.раз > с_инд.иск"
          cmd /c "искра.exe < с_инд.иск > с_инд.exe"
          cmd /c "с_инд.exe"
          if ($LASTEXITCODE -ne 101) { throw "срез индекс: код $LASTEXITCODE вместо 101" }
          cmd /c "raz\разум.exe < тесты\границы\ср_созд_порядок.раз > с_пор.иск"
          cmd /c "искра.exe < с_пор.иск > с_пор.exe"
          cmd /c "с_пор.exe"
          if ($LASTEXITCODE -ne 102) { throw "срез создание: код $LASTEXITCODE вместо 102" }
          cmd /c "raz\разум.exe --режим быстро < тесты\границы\ср_конст_конец.раз > с_ош.txt"
          if ($LASTEXITCODE -eq 0) { throw "быстро: константный конец среза принят" }
          cmd /c "raz\разум.exe --режим быстро < тесты\границы\ср_инд_дин.раз > с_быс.иск"
          if (Select-String -Path с_быс.иск -Pattern "стд_сбой_границы" -SimpleMatch -Quiet) { throw "быстро: сгенерирована проверка" }
          cmd /c "raz\разум.exe < тесты\границы\ср_в_границах.раз > с_ок.иск"
          cmd /c "искра.exe < с_ок.иск > с_ок.exe"
          cmd /c "с_ок.exe"
          if ($LASTEXITCODE -ne 42) { throw "легальные срезы: код $LASTEXITCODE вместо 42" }

      - name: Границы строк — индекс 101, стр_срез 102, быстро без проверок
        run: |
          cmd /c "raz\разум.exe < тесты\границы\ст_инд_дин.раз > т_инд.иск"
          cmd /c "искра.exe < т_инд.иск > т_инд.exe"
          cmd /c "т_инд.exe"
          if ($LASTEXITCODE -ne 101) { throw "строка индекс: код $LASTEXITCODE вместо 101" }
          cmd /c "raz\разум.exe < тесты\границы\ст_срез_биб.раз > т_ср.иск"
          cmd /c "искра.exe < т_ср.иск > т_ср.exe"
          cmd /c "т_ср.exe"
          if ($LASTEXITCODE -ne 102) { throw "стр_срез: код $LASTEXITCODE вместо 102" }
          cmd /c "raz\разум.exe --режим быстро < тесты\границы\ст_конст_минус.раз > т_ош.txt"
          if ($LASTEXITCODE -eq 0) { throw "быстро: константный минус строки принят" }
          cmd /c "raz\разум.exe --режим быстро < тесты\границы\ст_инд_дин.раз > т_быс.иск"
          if (Select-String -Path т_быс.иск -Pattern "стд_сбой_границы" -SimpleMatch -Quiet) { throw "быстро: сгенерирована проверка" }
          cmd /c "raz\разум.exe < тесты\границы\ст_в_границах.раз > т_ок.иск"
          cmd /c "искра.exe < т_ок.иск > т_ок.exe"
          cmd /c "т_ок.exe"
          if ($LASTEXITCODE -ne 42) { throw "легальные строки: код $LASTEXITCODE вместо 42" }

      - name: Сбои — диагностика 101/103 и точка СЛЕДа на обработчике
        run: |
          cmd /c "raz\разум.exe < тесты\границы\дин_чтение.раз > т_сб.иск"
          cmd /c "искра.exe < т_сб.иск > т_сб.exe"
          cmd /c "т_сб.exe 2> т_сб.txt"
          if ($LASTEXITCODE -ne 101) { throw "граница: код $LASTEXITCODE вместо 101" }
          if ((Get-Item т_сб.txt).Length -eq 0) { throw "граница: stderr пуст" }
          cmd /c "raz\разум.exe < тесты\границы\пам_выдели.раз > т_пм.иск"
          cmd /c "искра.exe < т_пм.иск > т_пм.exe"
          cmd /c "т_пм.exe 2> т_пм.txt"
          if ($LASTEXITCODE -ne 103) { throw "память: код $LASTEXITCODE вместо 103" }
          if ((Get-Item т_пм.txt).Length -eq 0) { throw "память: stderr пуст" }
          [IO.File]::WriteAllText("$pwd\_сц.txt", "пуск т_сб.exe`nкарта т_сб.иск`nточка стд_сбой_границы`nиди`nстоп`nвыход`n")
          cmd /c "след\след.exe < _сц.txt > _след_вых.txt"
          if (-not (Select-String -Path _след_вых.txt -Pattern "точка #1 по" -Quiet)) { throw "СЛЕД: точка на стд_сбой_границы не сработала" }

      - name: Оптимизация проверок — доказанные индексы без динамики
        run: |
          cmd /c "raz\разум.exe < тесты\границы\опт_для_масс.раз > о_масс.иск"
          if (Select-String -Path о_масс.иск -Pattern "стд_сбой_границы" -Quiet) { throw "доказанный цикл: проверка не удалена" }
          cmd /c "искра.exe < о_масс.иск > о_масс.exe"
          cmd /c "о_масс.exe"
          if ($LASTEXITCODE -ne 42) { throw "доказанный цикл: код $LASTEXITCODE вместо 42" }
          cmd /c "raz\разум.exe < тесты\границы\опт_мут_инд.раз > о_мут.иск"
          if (-not (Select-String -Path о_мут.иск -Pattern "стд_сбой_границы" -Quiet)) { throw "мутация индекса: проверка потеряна" }
          cmd /c "искра.exe < о_мут.иск > о_мут.exe"
          cmd /c "о_мут.exe 2> nul"
          if ($LASTEXITCODE -ne 101) { throw "мутация индекса: код $LASTEXITCODE вместо 101" }
          cmd /c "raz\разум.exe -O0 < тесты\границы\опт_для_колл.раз > о_o0.иск"
          if (Select-String -Path о_o0.иск -Pattern "стд_сбой_границы" -Quiet) { throw "-O0: проверка не удалена" }
          cmd /c "raz\разум.exe -O1 < тесты\границы\опт_для_колл.раз > о_o1.иск"
          if (Select-String -Path о_o1.иск -Pattern "стд_сбой_границы" -Quiet) { throw "-O1: проверка не удалена" }
          cmd /c "raz\разум.exe --режим быстро < тесты\границы\опт_за_пределом.раз > о_быс.иск"
          if (Select-String -Path о_быс.иск -Pattern "стд_сбой" -Quiet) { throw "быстро: обработчики испущены" }

      - name: "Память — проверка: двойное/утечка/огранка → 104"
        run: |
          cmd /c "raz\разум.exe --память проверка < тесты\память\пров_ок.раз > м_ок.иск"
          cmd /c "искра.exe < м_ок.иск > м_ок.exe"
          cmd /c "м_ок.exe"
          if ($LASTEXITCODE -ne 42) { throw "проверка: код $LASTEXITCODE вместо 42" }
          cmd /c "raz\разум.exe --память проверка < тесты\память\пров_двойное.раз > м_дв.иск"
          cmd /c "искра.exe < м_дв.иск > м_дв.exe"
          cmd /c "м_дв.exe 2> м_дв.txt"
          if ($LASTEXITCODE -ne 104) { throw "двойное: код $LASTEXITCODE вместо 104" }
          if (-not (Select-String -Path м_дв.txt -Pattern "целостности" -Quiet)) { throw "двойное: нет диагностики" }
          cmd /c "raz\разум.exe --память проверка < тесты\память\пров_утечка.раз > м_ут.иск"
          cmd /c "искра.exe < м_ут.иск > м_ут.exe"
          cmd /c "м_ут.exe 2> м_ут.txt"
          if ($LASTEXITCODE -ne 104) { throw "утечка: код $LASTEXITCODE вместо 104" }
          if (-not (Select-String -Path м_ут.txt -Pattern "утечки памяти" -Quiet)) { throw "утечка: нет отчёта" }
          cmd /c "raz\разум.exe < тесты\память\пров_ок.раз > м_об.иск"
          if (Select-String -Path м_об.иск -Pattern "стд_пам" -Quiet) { throw "обычно: диагностика испущена" }

      - name: Типы — размер/смещение
        run: |
          cmd /c "raz\разум.exe < тесты\типы\размер_смещение.раз > т_рс.иск"
          cmd /c "искра.exe < т_рс.иск > т_рс.exe"
          cmd /c "т_рс.exe"
          if ($LASTEXITCODE -ne 42) { throw "размер/смещение: код $LASTEXITCODE" }
          cmd /c "raz\разум.exe < тесты\типы\индексы.раз > т_ин.иск"
          cmd /c "искра.exe < т_ин.иск > т_ин.exe"
          cmd /c "т_ин.exe"
          if ($LASTEXITCODE -ne 142) { throw "индексы: код $LASTEXITCODE" }
          cmd /c "raz\разум.exe < тесты\типы\несовмест_знак.раз > т_нз.txt"
          if ($LASTEXITCODE -eq 0) { throw "размер=смещение принято без приведения" }
          if (-not (Select-String -Path т_нз.txt -Pattern "несовместимые" -Quiet)) { throw "нет диагностики несовместимости" }

      - name: Видимость модулей — открыто/скрыто
        run: |
          cmd /c "raz\разум.exe < тесты\модули\вид_откр.раз > т_вм.иск"
          cmd /c "искра.exe < т_вм.иск > т_вм.exe"
          cmd /c "т_вм.exe"
          if ($LASTEXITCODE -ne 42) { throw "открыто: код $LASTEXITCODE" }
          cmd /c "raz\разум.exe < тесты\модули\ошибка_скрытая_функ.раз > т_скр.txt"
          if ($LASTEXITCODE -eq 0) { throw "скрытая функция принята из чужого модуля" }
          if (-not (Select-String -Path т_скр.txt -Pattern "скрыто в модуле" -Quiet)) { throw "нет диагностики видимости" }

      - name: Кэш интерфейсов .рми
        run: |
          cmd /c "raz\разум.exe --кэш выкл < тесты\модули\кэш_польз.раз > т_к0.иск"
          cmd /c "raz\разум.exe < тесты\модули\кэш_польз.раз > т_к1.иск"
          cmd /c "raz\разум.exe < тесты\модули\кэш_польз.раз > т_к2.иск"
          if (-not (Test-Path тесты\модули\кэш_мод.windows.рми)) { throw ".рми не создан" }
          cmd /c "fc /b т_к0.иск т_к1.иск > nul"
          if ($LASTEXITCODE -ne 0) { throw "запись кэша изменила выход" }
          cmd /c "fc /b т_к0.иск т_к2.иск > nul"
          if ($LASTEXITCODE -ne 0) { throw "чтение кэша изменило выход" }
          cmd /c "искра.exe < т_к2.иск > т_к2.exe"
          cmd /c "т_к2.exe"
          if ($LASTEXITCODE -ne 41) { throw "кэш: код $LASTEXITCODE" }
          cmd /c "raz\разум.exe < тесты\модули\ошибка_кэш_скрытая.раз > т_кс.txt"
          if ($LASTEXITCODE -eq 0) { throw "скрытое имя кэшированного модуля принято" }
          if (-not (Select-String -Path т_кс.txt -Pattern "скрыто в модуле" -Quiet)) { throw "нет диагностики видимости из кэша" }

      - name: Отметки стабильности биб
        run: |
          $bad = Get-ChildItem биб -Recurse -Filter *.раз | Where-Object { -not ((Get-Content $_.FullName -TotalCount 3) -match ';(стабильно|развивается)') }
          if ($bad) { throw "модули без отметки ;стабильно/;развивается: $($bad.Name)" }

      - name: Мигратор переведи — сборка
        run: |
          cmd /c "raz\разум.exe < переведи\переведи.раз > переведи\переведи.иск"
          cmd /c "искра.exe < переведи\переведи.иск > переведи\переведи.exe"

      - name: сборка и запуск тест-раннера
        run: |
          cmd /c "raz\разум.exe < тесты\прогон.раз > прогон.иск"
          cmd /c "искра.exe < прогон.иск > прогон.exe"
          cmd /c "прогон.exe"
          if ($LASTEXITCODE -ne 0) { throw "тестов провалено: $LASTEXITCODE" }
          exit 0

      - name: Фикс-поинт самосборки
        run: |
          cd raz
          cmd /c "разум.exe < разум.раз > сам1.иск"
          cmd /c "..\искра.exe < сам1.иск > разум2.exe"
          cmd /c "разум2.exe < разум.раз > сам2.иск"
          cmd /c "fc /b сам1.иск сам2.иск > nul"
          if ($LASTEXITCODE -ne 0) { throw "фикс-поинт не сошёлся" }
          Write-Output "фикс-поинт: два поколения выдали идентичную ИСКРУ"

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Проверка сид-бинарников (ELF)
        run: |
          chmod +x искра raz/разум
          od -A x -t x1 -N 4 искра | grep -q "7f 45 4c 46"
          od -A x -t x1 -N 4 raz/разум | grep -q "7f 45 4c 46"

      - name: искра собирает привет_linux.иск
        run: |
          ./искра < examples/привет_linux.иск > привет
          od -A x -t x1 -N 4 привет | grep -q "7f 45 4c 46"
          chmod +x привет && ./привет

      - name: Безопасность типов — строгий лог
        run: |
          if ./raz/разум --цель linux < тесты/лог/если_число.раз > лог_ошибка.txt; then exit 1; fi
          grep -q "условие должно иметь тип лог" лог_ошибка.txt
          ./raz/разум --цель linux < тесты/лог/верные.раз > лог_верно.иск

      - name: Режимы безопасности — надёжно|быстро
        run: |
          ./raz/разум --цель linux < тесты/лог/верные.раз > режим_умолч.иск
          grep -q ";режим надёжно" режим_умолч.иск
          ./raz/разум --цель linux --режим быстро < тесты/лог/верные.раз > режим_быс.иск
          grep -q ";режим быстро" режим_быс.иск
          ./raz/разум --цель linux -O1 --режим быстро < тесты/лог/верные.раз > режим_o1.иск
          grep -q ";режим быстро" режим_o1.иск
          if ./raz/разум --цель linux --режим криво < тесты/лог/верные.раз > режим_ош.txt; then exit 1; fi
          grep -q "неизвестный режим" режим_ош.txt
          if ./raz/разум --цель linux --режим быстро < тесты/лог/если_число.раз > лог_быс.txt; then exit 1; fi

      - name: Границы массивов — надёжно ловит, быстро не генерирует
        run: |
          ./raz/разум --цель linux < тесты/границы/дин_чтение.раз > г_дин.иск
          ./искра < г_дин.иск > г_дин && chmod +x г_дин
          ./г_дин || код=$?; [ ${код:-0} -eq 101 ]
          if ./raz/разум --цель linux --режим быстро < тесты/границы/конст_чтение.раз > г_ош.txt; then exit 1; fi
          grep -q "вне границ массива" г_ош.txt
          ./raz/разум --цель linux --режим быстро < тесты/границы/дин_чтение.раз > г_быс.иск
          ! grep -q "стд_сбой_границы" г_быс.иск

      - name: Границы срезов — индекс 101, создание 102, быстро без проверок
        run: |
          ./raz/разум --цель linux < тесты/границы/ср_инд_дин.раз > с_инд.иск
          ./искра < с_инд.иск > с_инд && chmod +x с_инд
          ./с_инд || код=$?; [ ${код:-0} -eq 101 ]
          ./raz/разум --цель linux < тесты/границы/ср_созд_порядок.раз > с_пор.иск
          ./искра < с_пор.иск > с_пор && chmod +x с_пор
          ./с_пор || код=$?; [ ${код:-0} -eq 102 ]
          if ./raz/разум --цель linux --режим быстро < тесты/границы/ср_конст_конец.раз > с_ош.txt; then exit 1; fi
          ./raz/разум --цель linux --режим быстро < тесты/границы/ср_инд_дин.раз > с_быс.иск
          ! grep -q "стд_сбой_границы" с_быс.иск
          ./raz/разум --цель linux < тесты/границы/ср_в_границах.раз > с_ок.иск
          ./искра < с_ок.иск > с_ок && chmod +x с_ок
          ./с_ок || код=$?; [ ${код:-0} -eq 42 ]

      - name: Границы строк — индекс 101, стр_срез 102, быстро без проверок
        run: |
          ./raz/разум --цель linux < тесты/границы/ст_инд_дин.раз > т_инд.иск
          ./искра < т_инд.иск > т_инд && chmod +x т_инд
          ./т_инд || код=$?; [ ${код:-0} -eq 101 ]
          ./raz/разум --цель linux < тесты/границы/ст_срез_биб.раз > т_ср.иск
          ./искра < т_ср.иск > т_ср && chmod +x т_ср
          ./т_ср || код=$?; [ ${код:-0} -eq 102 ]
          if ./raz/разум --цель linux --режим быстро < тесты/границы/ст_конст_минус.раз > т_ош.txt; then exit 1; fi
          ./raz/разум --цель linux --режим быстро < тесты/границы/ст_инд_дин.раз > т_быс.иск
          ! grep -q "стд_сбой_границы" т_быс.иск
          ./raz/разум --цель linux < тесты/границы/ст_в_границах.раз > т_ок.иск
          ./искра < т_ок.иск > т_ок && chmod +x т_ок
          ./т_ок || код=$?; [ ${код:-0} -eq 42 ]

      - name: Сбои — диагностика 101/103 в stderr
        run: |
          ./raz/разум --цель linux < тесты/границы/дин_чтение.раз > т_сб.иск
          ./искра < т_сб.иск > т_сб && chmod +x т_сб
          код=0; ./т_сб 2> т_сб.txt || код=$?; [ $код -eq 101 ] && [ -s т_сб.txt ]
          ./raz/разум --цель linux < тесты/границы/пам_выдели.раз > т_пм.иск
          ./искра < т_пм.иск > т_пм && chmod +x т_пм
          код=0; ./т_пм 2> т_пм.txt || код=$?; [ $код -eq 103 ] && [ -s т_пм.txt ]

      - name: Оптимизация проверок — доказанные индексы без динамики
        run: |
          ./raz/разум --цель linux < тесты/границы/опт_для_масс.раз > о_масс.иск
          ! grep -q "стд_сбой_границы" о_масс.иск
          ./искра < о_масс.иск > о_масс && chmod +x о_масс
          код=0; ./о_масс || код=$?; [ $код -eq 42 ]
          ./raz/разум --цель linux < тесты/границы/опт_мут_инд.раз > о_мут.иск
          grep -q "стд_сбой_границы" о_мут.иск
          ./искра < о_мут.иск > о_мут && chmod +x о_мут
          код=0; ./о_мут 2>/dev/null || код=$?; [ $код -eq 101 ]
          ./raz/разум --цель linux -O0 < тесты/границы/опт_для_колл.раз > о_o0.иск
          ! grep -q "стд_сбой_границы" о_o0.иск
          ./raz/разум --цель linux -O1 < тесты/границы/опт_для_колл.раз > о_o1.иск
          ! grep -q "стд_сбой_границы" о_o1.иск
          ./raz/разум --цель linux --режим быстро < тесты/границы/опт_за_пределом.раз > о_быс.иск
          ! grep -q "стд_сбой" о_быс.иск

      - name: "Память — проверка: двойное/утечка/огранка → 104"
        run: |
          ./raz/разум --цель linux --память проверка < тесты/память/пров_ок.раз > м_ок.иск
          ./искра < м_ок.иск > м_ок && chmod +x м_ок
          код=0; ./м_ок || код=$?; [ $код -eq 42 ]
          ./raz/разум --цель linux --память проверка < тесты/память/пров_двойное.раз > м_дв.иск
          ./искра < м_дв.иск > м_дв && chmod +x м_дв
          код=0; ./м_дв 2> м_дв.txt || код=$?; [ $код -eq 104 ] && grep -q "целостности" м_дв.txt
          ./raz/разум --цель linux --память проверка < тесты/память/пров_утечка.раз > м_ут.иск
          ./искра < м_ут.иск > м_ут && chmod +x м_ут
          код=0; ./м_ут 2> м_ут.txt || код=$?; [ $код -eq 104 ] && grep -q "утечки памяти" м_ут.txt
          ./raz/разум --цель linux < тесты/память/пров_ок.раз > м_об.иск
          ! grep -q "стд_пам" м_об.иск

      - name: Типы — размер/смещение
        run: |
          ./raz/разум --цель linux < тесты/типы/размер_смещение.раз > т_рс.иск
          ./искра < т_рс.иск > т_рс && chmod +x т_рс
          код=0; ./т_рс || код=$?; [ $код -eq 42 ]
          ./raz/разум --цель linux < тесты/типы/индексы.раз > т_ин.иск
          ./искра < т_ин.иск > т_ин && chmod +x т_ин
          код=0; ./т_ин || код=$?; [ $код -eq 142 ]
          if ./raz/разум --цель linux < тесты/типы/несовмест_знак.раз > т_нз.txt; then exit 1; fi
          grep -q "несовместимые" т_нз.txt

      - name: Видимость модулей — открыто/скрыто
        run: |
          ./raz/разум --цель linux < тесты/модули/вид_откр.раз > т_вм.иск
          ./искра < т_вм.иск > т_вм && chmod +x т_вм
          код=0; ./т_вм || код=$?; [ $код -eq 42 ]
          if ./raz/разум --цель linux < тесты/модули/ошибка_скрытая_функ.раз > т_скр.txt; then exit 1; fi
          grep -q "скрыто в модуле" т_скр.txt

      - name: Кэш интерфейсов .рми
        run: |
          ./raz/разум --цель linux --кэш выкл < тесты/модули/кэш_польз.раз > т_к0.иск
          ./raz/разум --цель linux < тесты/модули/кэш_польз.раз > т_к1.иск
          ./raz/разум --цель linux < тесты/модули/кэш_польз.раз > т_к2.иск
          test -f тесты/модули/кэш_мод.linux.рми
          cmp т_к0.иск т_к1.иск
          cmp т_к0.иск т_к2.иск
          ./искра < т_к2.иск > т_к2 && chmod +x т_к2
          код=0; ./т_к2 || код=$?; [ $код -eq 41 ]
          if ./raz/разум --цель linux < тесты/модули/ошибка_кэш_скрытая.раз > т_кс.txt; then exit 1; fi
          grep -q "скрыто в модуле" т_кс.txt

      - name: Отметки стабильности биб
        run: |
          for f in $(find биб -name '*.раз'); do head -3 "$f" | grep -qE ';(стабильно|развивается)' || { echo "нет отметки: $f"; exit 1; }; done

      - name: Мигратор переведи — сборка
        run: |
          ./raz/разум --цель linux < переведи/переведи.раз > переведи/переведи.иск
          ./искра < переведи/переведи.иск > переведи/переведи
          chmod +x переведи/переведи

      - name: сборка и запуск тест-раннера
        run: |
          ./raz/разум --цель linux < тесты/прогон.раз > прогон.иск
          ./искра < прогон.иск > прогон
          chmod +x прогон
          ./прогон

      - name: Фикс-поинт самосборки
        run: |
          cd raz
          chmod +x разум ../искра
          ./разум --цель linux < разум.раз > сам1.иск
          ../искра < сам1.иск > разум2
          chmod +x разум2
          ./разум2 --цель linux < разум.раз > сам2.иск
          cmp сам1.иск сам2.иск
          echo "фикс-поинт: два поколения выдали идентичную ИСКРУ"

  # macOS на Intel — x86_64 исполняется нативно, без Rosetta.
  # Сиды — искра_мак, raz/разум_мак (Mach-O x86_64).
  macos:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Проверка сид-бинарников (Mach-O)
        run: |
          file искра_мак | grep -q "Mach-O 64-bit executable x86_64"
          file raz/разум_мак | grep -q "Mach-O 64-bit executable x86_64"

      - name: смоук — сырая ИСКРА, выход(42)
        run: |
          chmod +x raz/разум_мак искра_мак
          codesign -s - --force raz/разум_мак искра_мак
          printf ';цель macos\nСЕКЦИЯ код\nВХОД старт\nстарт:\n    ПЕР ПРМ, 42\n    ПЕР АКК, 0x2000001\n    СИСВЫЗОВ\n' > мин.иск
          ./искра_мак < мин.иск > мин && chmod +x мин
          ./мин || [ $? -eq 42 ]
          codesign -s - --force мин
          ./мин || [ $? -eq 42 ]

      - name: смоук — разум выход(42) и вывод
        run: |
          printf 'взять система\nфунк главная() цел.верх:\n    выход(42)\n' > мин.раз
          ./raz/разум_мак --цель macos < мин.раз > мин.иск
          ./искра_мак < мин.иск > мин && chmod +x мин && codesign -s - --force мин
          ./мин || [ $? -eq 42 ]
          printf 'взять основа\nфунк главная() цел.верх:\n    печатьстр("мак-ок")\n    верни 0\n' > привет.раз
          ./raz/разум_мак --цель macos < привет.раз > привет.иск
          ./искра_мак < привет.иск > привет && chmod +x привет && codesign -s - --force привет
          ./привет | grep -q "мак-ок"

      - name: Безопасность типов — строгий лог
        run: |
          if ./raz/разум_мак --цель macos < тесты/лог/если_число.раз > лог_ошибка.txt; then exit 1; fi
          grep -q "условие должно иметь тип лог" лог_ошибка.txt
          ./raz/разум_мак --цель macos < тесты/лог/верные.раз > лог_верно.иск

      - name: Режимы безопасности — надёжно|быстро
        run: |
          ./raz/разум_мак --цель macos < тесты/лог/верные.раз > режим_умолч.иск
          grep -q ";режим надёжно" режим_умолч.иск
          ./raz/разум_мак --цель macos --режим быстро < тесты/лог/верные.раз > режим_быс.иск
          grep -q ";режим быстро" режим_быс.иск
          ./raz/разум_мак --цель macos -O1 --режим быстро < тесты/лог/верные.раз > режим_o1.иск
          grep -q ";режим быстро" режим_o1.иск
          if ./raz/разум_мак --цель macos --режим криво < тесты/лог/верные.раз > режим_ош.txt; then exit 1; fi
          grep -q "неизвестный режим" режим_ош.txt
          if ./raz/разум_мак --цель macos --режим быстро < тесты/лог/если_число.раз > лог_быс.txt; then exit 1; fi

      - name: Границы массивов — надёжно ловит, быстро не генерирует
        run: |
          ./raz/разум_мак --цель macos < тесты/границы/дин_чтение.раз > г_дин.иск
          ./искра_мак < г_дин.иск > г_дин && chmod +x г_дин && codesign -s - --force г_дин
          ./г_дин || код=$?; [ ${код:-0} -eq 101 ]
          if ./raz/разум_мак --цель macos --режим быстро < тесты/границы/конст_чтение.раз > г_ош.txt; then exit 1; fi
          grep -q "вне границ массива" г_ош.txt
          ./raz/разум_мак --цель macos --режим быстро < тесты/границы/дин_чтение.раз > г_быс.иск
          ! grep -q "стд_сбой_границы" г_быс.иск

      - name: Границы срезов — индекс 101, создание 102, быстро без проверок
        run: |
          ./raz/разум_мак --цель macos < тесты/границы/ср_инд_дин.раз > с_инд.иск
