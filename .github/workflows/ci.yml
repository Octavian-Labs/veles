      - name: Видимость модулей — открыто/скрыто
        run: |
          ./raz/разум_мак --цель macos < тесты/модули/вид_откр.раз > т_вм.иск
          ./искра_мак < т_вм.иск > т_вм && chmod +x т_вм && codesign -s - --force т_вм
          код=0; ./т_вм || код=$?; [ $код -eq 42 ]
          if ./raz/разум_мак --цель macos < тесты/модули/ошибка_скрытая_функ.раз > т_скр.txt; then exit 1; fi
          grep -q "скрыто в модуле" т_скр.txt

      - name: Кэш интерфейсов .рми
        run: |
          ./raz/разум_мак --цель macos --кэш выкл < тесты/модули/кэш_польз.раз > т_к0.иск
          ./raz/разум_мак --цель macos < тесты/модули/кэш_польз.раз > т_к1.иск
          ./raz/разум_мак --цель macos < тесты/модули/кэш_польз.раз > т_к2.иск
          test -f тесты/модули/кэш_мод.macos.рми
          cmp т_к0.иск т_к1.иск
          cmp т_к0.иск т_к2.иск
          ./искра_мак < т_к2.иск > т_к2 && chmod +x т_к2 && codesign -s - --force т_к2
          код=0; ./т_к2 || код=$?; [ $код -eq 41 ]
          if ./raz/разум_мак --цель macos < тесты/модули/ошибка_кэш_скрытая.раз > т_кс.txt; then exit 1; fi
          grep -q "скрыто в модуле" т_кс.txt

      - name: Отметки стабильности биб
        run: |
          for f in $(find биб -name '*.раз'); do head -3 "$f" | grep -qE ';(стабильно|развивается)' || { echo "нет отметки: $f"; exit 1; }; done

      - name: смоук — процесс.запусти (fork/execve/wait4)
        run: |
          printf 'x\n' > вход.txt
          printf 'взять основа\nвзять процесс\nфунк главная() цел.верх:\n    к := запусти("/bin/echo", "мак-привет", "вход.txt", "вых.txt")\n    печатьстр(стр_склей("запусти=", цел_в_стр(к)))\n    т := файл_прочти("вых.txt")\n    если т != пусто: печатьстр(т)\n    верни 0\n' > зп.раз
          ./raz/разум_мак --цель macos < зп.раз > зп.иск && ./искра_мак < зп.иск > зп && chmod +x зп && codesign -s - --force зп
          ./зп | tee зп_лог
          grep -q "запусти=0" зп_лог
          grep -q "мак-привет" зп_лог

      - name: Мигратор переведи — сборка
        run: |
          ./raz/разум_мак --цель macos < переведи/переведи.раз > переведи/переведи.иск
          ./искра_мак < переведи/переведи.иск > переведи/переведи_мак
          chmod +x переведи/переведи_мак && codesign -s - --force переведи/переведи_мак

      - name: сборка и запуск тест-раннера
        run: |
          ./raz/разум_мак --цель macos < тесты/прогон.раз > прогон.иск
          ./искра_мак < прогон.иск > прогон
          chmod +x прогон && codesign -s - --force прогон
          ./прогон

      - name: Фикс-поинт самосборки
        run: |
          cd raz
          ./разум_мак --цель macos < разум.раз > сам1.иск
          ../искра_мак < сам1.иск > разум2_мак
          chmod +x разум2_мак && codesign -s - --force разум2_мак
          ./разум2_мак --цель macos < разум.раз > сам2.иск
          cmp сам1.иск сам2.иск
          echo "фикс-поинт: два поколения выдали идентичную ИСКРУ"
