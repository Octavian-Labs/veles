          ./т_инд || код=$?; [ ${код:-0} -eq 101 ]
          ./raz/разум_мак --цель macos < тесты/границы/ст_срез_биб.раз > т_ср.иск
          ./искра_мак < т_ср.иск > т_ср && chmod +x т_ср && codesign -s - --force т_ср
          ./т_ср || код=$?; [ ${код:-0} -eq 102 ]
          if ./raz/разум_мак --цель macos --режим быстро < тесты/границы/ст_конст_минус.раз > т_ош.txt; then exit 1; fi
          ./raz/разум_мак --цель macos --режим быстро < тесты/границы/ст_инд_дин.раз > т_быс.иск
          ! grep -q "стд_сбой_границы" т_быс.иск
          ./raz/разум_мак --цель macos < тесты/границы/ст_в_границах.раз > т_ок.иск
          ./искра_мак < т_ок.иск > т_ок && chmod +x т_ок && codesign -s - --force т_ок
          ./т_ок || код=$?; [ ${код:-0} -eq 42 ]

      - name: Сбои — диагностика 101/103 в stderr
        run: |
          ./raz/разум_мак --цель macos < тесты/границы/дин_чтение.раз > т_сб.иск
          ./искра_мак < т_сб.иск > т_сб && chmod +x т_сб && codesign -s - --force т_сб
          код=0; ./т_сб 2> т_сб.txt || код=$?; [ $код -eq 101 ] && [ -s т_сб.txt ]
          ./raz/разум_мак --цель macos < тесты/границы/пам_выдели.раз > т_пм.иск
          ./искра_мак < т_пм.иск > т_пм && chmod +x т_пм && codesign -s - --force т_пм
          код=0; ./т_пм 2> т_пм.txt || код=$?; [ $код -eq 103 ] && [ -s т_пм.txt ]

      - name: Оптимизация проверок — доказанные индексы без динамики
        run: |
          ./raz/разум_мак --цель macos < тесты/границы/опт_для_масс.раз > о_масс.иск
          ! grep -q "стд_сбой_границы" о_масс.иск
          ./искра_мак < о_масс.иск > о_масс && chmod +x о_масс && codesign -s - --force о_масс
          код=0; ./о_масс || код=$?; [ $код -eq 42 ]
          ./raz/разум_мак --цель macos < тесты/границы/опт_мут_инд.раз > о_мут.иск
          grep -q "стд_сбой_границы" о_мут.иск
          ./искра_мак < о_мут.иск > о_мут && chmod +x о_мут && codesign -s - --force о_мут
          код=0; ./о_мут 2>/dev/null || код=$?; [ $код -eq 101 ]
          ./raz/разум_мак --цель macos -O0 < тесты/границы/опт_для_колл.раз > о_o0.иск
          ! grep -q "стд_сбой_границы" о_o0.иск
          ./raz/разум_мак --цель macos -O1 < тесты/границы/опт_для_колл.раз > о_o1.иск
          ! grep -q "стд_сбой_границы" о_o1.иск
          ./raz/разум_мак --цель macos --режим быстро < тесты/границы/опт_за_пределом.раз > о_быс.иск
          ! grep -q "стд_сбой" о_быс.иск

      - name: "Память — проверка: двойное/утечка/огранка → 104"
        run: |
          ./raz/разум_мак --цель macos --память проверка < тесты/память/пров_ок.раз > м_ок.иск
          ./искра_мак < м_ок.иск > м_ок && chmod +x м_ок && codesign -s - --force м_ок
          код=0; ./м_ок || код=$?; [ $код -eq 42 ]
          ./raz/разум_мак --цель macos --память проверка < тесты/память/пров_двойное.раз > м_дв.иск
          ./искра_мак < м_дв.иск > м_дв && chmod +x м_дв && codesign -s - --force м_дв
          код=0; ./м_дв 2> м_дв.txt || код=$?; [ $код -eq 104 ] && grep -q "целостности" м_дв.txt
          ./raz/разум_мак --цель macos --память проверка < тесты/память/пров_утечка.раз > м_ут.иск
          ./искра_мак < м_ут.иск > м_ут && chmod +x м_ут && codesign -s - --force м_ут
          код=0; ./м_ут 2> м_ут.txt || код=$?; [ $код -eq 104 ] && grep -q "утечки памяти" м_ут.txt
          ./raz/разум_мак --цель macos < тесты/память/пров_ок.раз > м_об.иск
          ! grep -q "стд_пам" м_об.иск

      - name: Типы — размер/смещение
        run: |
