          ./искра_мак < т_рс.иск > т_рс && chmod +x т_рс && codesign -s - --force т_рс
          код=0; ./т_рс || код=$?; [ $код -eq 42 ]
          ./raz/разум_мак --цель macos < тесты/типы/индексы.раз > т_ин.иск
          ./искра_мак < т_ин.иск > т_ин && chmod +x т_ин && codesign -s - --force т_ин
          код=0; ./т_ин || код=$?; [ $код -eq 142 ]
          if ./raz/разум_мак --цель macos < тесты/типы/несовмест_знак.раз > т_нз.txt; then exit 1; fi
