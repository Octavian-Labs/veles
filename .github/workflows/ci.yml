# CI: нативная проверка toolchain ВЕЛЕС.
# Python здесь нет: сборку и проверку выполняют сами разум и искра.
# Два рубежа: тест-раннер «тесты/прогон.раз» гоняет примеры и кейсы
# (компиляция разум+искра, запуск, сверка кода выхода и вывода), а фикс-поинт
# самосборки доказывает, что компилятор воспроизводит сам себя побайтно.
name: CI

on:
  push:
    branches: [main, develop, "feature/*"]
  pull_request:
    branches: [main, develop]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Бинарный ввод-вывод: cmd /c внутри pwsh — pwsh корректно передаёт
      # юникодные пути (кириллица), а cmd делает байтовое перенаправление.
      - name: Проверка сид-бинарников (MZ)
        run: |
          if (([IO.File]::ReadAllBytes("$PWD\искра.exe")[0..1] -join ',') -ne '77,90') { throw "искра.exe не PE" }
          if (([IO.File]::ReadAllBytes("$PWD\raz\разум.exe")[0..1] -join ',') -ne '77,90') { throw "разум.exe не PE" }

      - name: искра собирает привет.иск
        run: |
          cmd /c "искра.exe < examples\привет.иск > привет.exe"
          cmd /c "привет.exe"

      - name: сборка и запуск тест-раннера
        run: |
          cmd /c "raz\разум.exe < тесты\прогон.раз > прогон.иск"
          cmd /c "искра.exe < прогон.иск > прогон.exe"
          cmd /c "прогон.exe"
          if ($LASTEXITCODE -ne 0) { throw "тестов провалено: $LASTEXITCODE" }
          exit 0

      - name: Фикс-поинт самосборки
        run: |
          cd raz
          cmd /c "разум.exe < разум.раз > сам1.иск"
          cmd /c "..\искра.exe < сам1.иск > разум2.exe"
          cmd /c "разум2.exe < разум.раз > сам2.иск"
          cmd /c "fc /b сам1.иск сам2.иск > nul"
          if ($LASTEXITCODE -ne 0) { throw "фикс-поинт не сошёлся" }
          Write-Output "фикс-поинт: два поколения выдали идентичную ИСКРУ"

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Проверка сид-бинарников (ELF)
        run: |
          chmod +x искра raz/разум
          od -A x -t x1 -N 4 искра | grep -q "7f 45 4c 46"
          od -A x -t x1 -N 4 raz/разум | grep -q "7f 45 4c 46"

      - name: искра собирает привет_linux.иск
        run: |
          ./искра < examples/привет_linux.иск > привет
          od -A x -t x1 -N 4 привет | grep -q "7f 45 4c 46"
          chmod +x привет && ./привет

      - name: сборка и запуск тест-раннера
        run: |
          ./raz/разум --цель linux < тесты/прогон.раз > прогон.иск
          ./искра < прогон.иск > прогон
          chmod +x прогон
          ./прогон

      - name: Фикс-поинт самосборки
        run: |
          cd raz
          chmod +x разум ../искра
          ./разум --цель linux < разум.раз > сам1.иск
          ../искра < сам1.иск > разум2
          chmod +x разум2
          ./разум2 --цель linux < разум.раз > сам2.иск
          cmp сам1.иск сам2.иск
          echo "фикс-поинт: два поколения выдали идентичную ИСКРУ"

  # macOS на Intel — x86_64 исполняется нативно, без Rosetta.
  # Сиды — искра_мак, raz/разум_мак (Mach-O x86_64).
  macos:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Проверка сид-бинарников (Mach-O)
        run: |
          file искра_мак | grep -q "Mach-O 64-bit executable x86_64"
          file raz/разум_мак | grep -q "Mach-O 64-bit executable x86_64"

      - name: смоук — сырая ИСКРА, выход(42)
        run: |
          set +e
          chmod +x raz/разум_мак искра_мак
          codesign -s - --force raz/разум_мак искра_мак
          printf ';цель macos\nСЕКЦИЯ код\nВХОД старт\nстарт:\n    ПЕР ПРМ, 42\n    ПЕР АКК, 0x2000001\n    СИСВЫЗОВ\n' > мин.иск
          ./искра_мак < мин.иск > мин && chmod +x мин
          echo "== без подписи =="; ./мин; echo "код=$?"
          codesign -s - --force мин
          echo "== с подписью =="; ./мин; echo "код=$?"
          echo "== otool =="; otool -l мин 2>&1 | head -40
          echo "== lldb =="; lldb --batch -o run -o "bt" -o "register read rip rsp" ./мин 2>&1 | tail -25
          true

      - name: смоук — разум выход(42) и вывод
        run: |
          printf 'взять система\nфунк главная() цел.верх:\n    выход(42)\n' > мин.раз
          ./raz/разум_мак --цель macos < мин.раз > мин.иск
          ./искра_мак < мин.иск > мин && chmod +x мин && codesign -s - --force мин
          ./мин || [ $? -eq 42 ]
          printf 'взять основа\nфунк главная() цел.верх:\n    печатьстр("мак-ок")\n    верни 0\n' > привет.раз
          ./raz/разум_мак --цель macos < привет.раз > привет.иск
          ./искра_мак < привет.иск > привет && chmod +x привет && codesign -s - --force привет
          ./привет | grep -q "мак-ок"

      - name: смоук — fork на сырой ИСКРЕ
        run: |
          set +e
          printf ';цель macos\nСЕКЦИЯ код\nВХОД старт\nстарт:\n    ПЕР АКК, 0x2000002\n    СИСВЫЗОВ\n    НЕПЕРЕНОС м_ок\n    ПЕР ПРМ, 61\n    ПЕР АКК, 0x2000001\n    СИСВЫЗОВ\nм_ок:\n    СРАВ АКК, 0\n    РАВНО м_дитя\n    ПЕР ПРМ, 62\n    ПЕР АКК, 0x2000001\n    СИСВЫЗОВ\nм_дитя:\n    ПЕР ПРМ, 2\n    АДР ИСТ, [б]\n    ПЕР ДАН, 1\n    ПЕР АКК, 0x2000004\n    СИСВЫЗОВ\n    ПЕР ПРМ, 63\n    ПЕР АКК, 0x2000001\n    СИСВЫЗОВ\nСЕКЦИЯ данные\nб: БАЙТ 68\n' > форк.иск
          ./искра_мак < форк.иск > форк && chmod +x форк && codesign -s - --force форк
          ./форк; echo "родитель_код=$? (ожидаем 62 + букву Д в stderr от дитяти)"

      - name: смоук — процесс.запусти (fork/execve/wait4)
        run: |
          set +e
          printf 'x\n' > вход.txt
          printf 'взять основа\nвзять процесс\nфунк главная() цел.верх:\n    к := запусти("/bin/echo", "мак-привет", "вход.txt", "вых.txt")\n    печатьстр(стр_склей("запусти=", цел_в_стр(к)))\n    т := файл_прочти("вых.txt")\n    если т != пусто: печатьстр(т)\n    верни 0\n' > зп.раз
          ./raz/разум_мак --цель macos < зп.раз > зп.иск && ./искра_мак < зп.иск > зп && chmod +x зп && codesign -s - --force зп
          ./зп; echo "раннер_код=$?"; cat вых.txt 2>/dev/null
          true

      - name: сборка и запуск тест-раннера
        run: |
          ./raz/разум_мак --цель macos < тесты/прогон.раз > прогон.иск
          ./искра_мак < прогон.иск > прогон
          chmod +x прогон && codesign -s - --force прогон
          ./прогон

      - name: Фикс-поинт самосборки
        run: |
          cd raz
          ./разум_мак --цель macos < разум.раз > сам1.иск
          ../искра_мак < сам1.иск > разум2_мак
          chmod +x разум2_мак && codesign -s - --force разум2_мак
          ./разум2_мак --цель macos < разум.раз > сам2.иск
          cmp сам1.иск сам2.иск
          echo "фикс-поинт: два поколения выдали идентичную ИСКРУ"
