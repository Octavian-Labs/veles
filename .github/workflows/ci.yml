          ./raz/разум_мак --цель macos --режим быстро < тесты/границы/ср_инд_дин.раз > с_быс.иск
          ! grep -q "стд_сбой_границы" с_быс.иск
          ./raz/разум_мак --цель macos < тесты/границы/ср_в_границах.раз > с_ок.иск
          ./искра_мак < с_ок.иск > с_ок && chmod +x с_ок && codesign -s - --force с_ок
          ./с_ок || код=$?; [ ${код:-0} -eq 42 ]

      - name: Границы строк — индекс 101, стр_срез 102, быстро без проверок
