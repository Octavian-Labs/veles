# CI: автопроверки и реальный запуск собранных бинарников
name: CI Checks

on:
  push:
    branches: [main, develop, "feature/*"]
  pull_request:
    branches: [main, develop]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install black flake8 flake8-pyproject pytest
      - name: Run checks
        run: |
          python -m black --check src tests
          python -m flake8 src tests
          python -m pytest tests
      - name: Build and run PE example
        run: |
          python -m src.iskra examples/привет.иск -o привет.exe
          ./привет.exe
      - name: Build and run РАЗУМ example
        run: |
          python -m src.razum examples/привет.раз -o привет_разум.exe
          ./привет_разум.exe
          python -m src.razum examples/вычисления.раз -o вычисления.exe
          ./вычисления.exe
          if ($LASTEXITCODE -ne 55) { exit 1 }

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install black flake8 flake8-pyproject pytest
      - name: Run checks
        run: |
          python -m black --check src tests
          python -m flake8 src tests
          python -m pytest tests
      - name: Build and run ELF example
        run: |
          python -m src.iskra examples/привет_linux.иск --цель linux -o привет
          chmod +x привет && ./привет
      - name: Build and run РАЗУМ ELF example
        run: |
          python -m src.razum examples/выход_linux.раз --цель linux -o выход
          chmod +x выход && ./выход
          [ $? -eq 42 ]
