# CI: нативная проверка toolchain ВЕЛЕС.
# Python здесь нет: сборку и проверку выполняют сами разум и искра.
# Главный тест — фикс-поинт самосборки: разум компилирует свой исходник,
# искра собирает разум2, и разум2 должен выдать тот же .иск побайтно.
name: CI

on:
  push:
    branches: [main, develop, "feature/*"]
  pull_request:
    branches: [main, develop]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Бинарный ввод-вывод: cmd /c внутри pwsh — pwsh корректно передаёт
      # юникодные пути (кириллица), а cmd делает байтовое перенаправление.
      - name: Проверка сид-бинарников (MZ)
        run: |
          if ((Get-Content искра.exe -Encoding Byte -TotalCount 2) -join ',') -ne '77,90' { throw "искра.exe не PE" }
          if ((Get-Content raz\разум.exe -Encoding Byte -TotalCount 2) -join ',') -ne '77,90' { throw "разум.exe не PE" }

      - name: искра собирает привет.иск
        run: |
          cmd /c "искра.exe < examples\привет.иск > привет.exe"
          cmd /c "привет.exe"

      - name: разум компилирует примеры
        run: |
          cmd /c "raz\разум.exe < examples\привет.раз > привет_разум.иск"
          cmd /c "искра.exe < привет_разум.иск > привет_разум.exe"
          cmd /c "привет_разум.exe"

      - name: ожидаемый код выхода 55
        run: |
          cmd /c "raz\разум.exe < examples\вычисления.раз > вычисления.иск"
          cmd /c "искра.exe < вычисления.иск > вычисления.exe"
          cmd /c "вычисления.exe"
          if ($LASTEXITCODE -ne 55) { throw "ожидали 55, получили $LASTEXITCODE" }
          exit 0

      - name: Фикс-поинт самосборки
        run: |
          cd raz
          cmd /c "разум.exe < разум.раз > сам1.иск"
          cmd /c "..\искра.exe < сам1.иск > разум2.exe"
          cmd /c "разум2.exe < разум.раз > сам2.иск"
          cmd /c "fc /b сам1.иск сам2.иск > nul"
          if ($LASTEXITCODE -ne 0) { throw "фикс-поинт не сошёлся" }
          Write-Output "фикс-поинт: два поколения выдали идентичную ИСКРУ"

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Проверка сид-бинарников (ELF)
        run: |
          chmod +x искра.elf raz/разум.elf
          od -A x -t x1 -N 4 искра.elf | grep -q "7f 45 4c 46"
          od -A x -t x1 -N 4 raz/разум.elf | grep -q "7f 45 4c 46"

      - name: искра собирает привет_linux.иск
        run: |
          ./искра.elf < examples/привет_linux.иск > привет
          od -A x -t x1 -N 4 привет | grep -q "7f 45 4c 46"
          chmod +x привет && ./привет

      - name: разум компилирует выход_linux.раз
        run: |
          ./raz/разум.elf --цель linux < examples/выход_linux.раз > выход.иск
          head -1 выход.иск | grep -q "цель linux"

      - name: ожидаемый код выхода 42
        run: |
          ./искра.elf < выход.иск > выход
          od -A x -t x1 -N 4 выход | grep -q "7f 45 4c 46"
          chmod +x выход
          код=0; ./выход || код=$?
          echo "код выхода: $код"
          [ "$код" -eq 42 ]

      - name: Фикс-поинт самосборки
        run: |
          cd raz
          chmod +x разум.elf ../искра.elf
          ./разум.elf --цель linux < разум.раз > сам1.иск
          ../искра.elf < сам1.иск > разум2
          chmod +x разум2
          ./разум2 --цель linux < разум.раз > сам2.иск
          cmp сам1.иск сам2.иск
          echo "фикс-поинт: два поколения выдали идентичную ИСКРУ"
