# CI: автопроверки и сборка примеров родным toolchain (разум + искра)
name: CI Checks

on:
  push:
    branches: [main, develop, "feature/*"]
  pull_request:
    branches: [main, develop]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install black flake8 flake8-pyproject pytest
      - name: Run checks
        run: |
          python -m black --check src tests
          python -m flake8 src tests
          python -m pytest tests
      - name: Build and run with native toolchain
        # бинарный вывод — только через cmd (pwsh перенаправляет как текст)
        shell: cmd
        run: |
          искра.exe < examples\привет.иск > привет.exe
          привет.exe
          raz\разум.exe < examples\привет.раз > привет_разум.иск
          искра.exe < привет_разум.иск > привет_разум.exe
          привет_разум.exe
          raz\разум.exe < examples\вычисления.раз > вычисления.иск
          искра.exe < вычисления.иск > вычисления.exe
          вычисления.exe
          if %ERRORLEVEL% NEQ 55 exit /b 1
          exit /b 0

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install black flake8 flake8-pyproject pytest
      - name: Run checks
        run: |
          python -m black --check src tests
          python -m flake8 src tests
          python -m pytest tests
      - name: Build and run with native toolchain
        run: |
          chmod +x искра.elf raz/разум.elf
          ./искра.elf < examples/привет_linux.иск > привет
          chmod +x привет && ./привет
          ./raz/разум.elf --цель linux < examples/выход_linux.раз > выход.иск
          ./искра.elf < выход.иск > выход
          chmod +x выход
          код=0; ./выход || код=$?
          echo "код выхода: $код"
          [ "$код" -eq 42 ]
