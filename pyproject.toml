[project]
name = "veles"
version = "0.1.0"
description = "ВЕЛЕС — русская экосистема: ассемблер ИСКРА, языки РАЗУМ и СОЗНАНИЕ"
requires-python = ">=3.10"

[tool.black]
line-length = 88

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]

[tool.pytest.ini_options]
testpaths = ["tests"]
